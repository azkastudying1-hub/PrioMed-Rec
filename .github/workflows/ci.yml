name: PrioMed-Rec CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backend unit tests
        run: |
          python -m pytest \
            tests/test_fase1_b103_auth.py \
            tests/test_fase1_b104_state_machine.py \
            tests/test_fase1_b105_priority.py \
            tests/test_fase1_b107_audit.py \
            tests/test_fase1_b111_normalizer.py \
            tests/test_fase3_ai_orchestration.py \
            tests/test_rules_disposition.py \
            tests/test_safety_flags_engine.py \
            tests/test_analysis_orchestrator.py \
            -v --tb=short

      - name: Verify API imports cleanly
        run: python -c "from api.main import app; print('API routes:', len(app.routes))"
        env:
          PYTHONPATH: backend

      - name: Verify priomedrec_core contracts
        run: python -c "from priomedrec_core.contracts import AnalysisInput, AnalysisResult; print('core contracts ok')"

      - name: Verify langflow component files syntax
        run: |
          python -m py_compile langflow/components/priomedrec/triage.py || true
          python -m py_compile langflow/components/priomedrec/safety.py || true
          python -m py_compile langflow/components/priomedrec/audit.py || true
          echo "langflow component files syntax ok (lfx module requires runtime Langflow)"

  frontend-build:
    name: Frontend Build (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: web

      - name: TypeScript compile check
        run: npm run build
        working-directory: web

  demo-seed-check:
    name: Demo Seed Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests]
    env:
      PYTHONPATH: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run demo seed
        run: |
          python scripts/seed_demo.py --db-path /tmp/demo_test.db
        env:
          DB_PATH: /tmp/demo_test.db

      - name: Verify 10 encounters seeded
        run: |
          python -c "
          import os; os.environ['DB_PATH'] = '/tmp/demo_test.db'
          from api.db.session import session_scope
          from api.db.models import Encounter
          with session_scope() as s:
              count = s.query(Encounter).count()
          assert count == 10, f'Expected 10 encounters, got {count}'
          print(f'OK: {count} encounters seeded')
          "
        env:
          DB_PATH: /tmp/demo_test.db

      - name: Run demo reset (idempotent check)
        run: |
          python scripts/demo_reset.py --db-path /tmp/demo_test.db
        env:
          DB_PATH: /tmp/demo_test.db
